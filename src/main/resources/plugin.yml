name: SlumDrugs
version: ${version}
main: dev.lucas.slumdrugs.SlumDrugsPlugin
api-version: '26.3'
description: Fictional substances, farming, a rundown district and the trouble that comes with it.
author: lucas
softdepend: [Vault]

commands:
  drugs:
    description: SlumDrugs commands
    usage: /drugs help
    aliases: [sd, slum]

permissions:
  slumdrugs.use:
    description: Player commands (status, deal, jobs)
    default: true
  slumdrugs.admin:
    description: Admin commands (give, district, spawn, reload)
    default: op
