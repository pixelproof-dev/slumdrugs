# Builds the mod and runs the simulation checks on every push and pull request.
# Gradle's toolchain support fetches the Java 25 the mod targets; the runner only
# needs a JDK new enough to start Gradle itself.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      # Data and assets against each other: lang coverage, recipe results, models, textures.
      - run: python3 tools/check_data.py
      # The dedicated server, headless: the only check that loads the data the way the game does.
      - run: tools/smoke_server.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-server-log
          path: build/smoke-server.log
      - uses: actions/upload-artifact@v4
        with:
          name: slumdrugs-jar
          path: neoforge/build/libs/*.jar
